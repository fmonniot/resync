plugins {
    alias(libs.plugins.android.application)
    alias(libs.plugins.ksp)
    alias(libs.plugins.kotlin.compose)
    id 'jacoco'
}

// Release signing is machine-specific: the keystore and its credentials live outside version
// control, in ~/.gradle/gradle.properties (or the matching environment variables, for CI). When
// they're not present — any machine but the owner's — the release build type falls back to the
// debug signing config so `assembleRelease` still produces an installable (debug-signed) APK
// instead of failing outright.
def releaseStoreFile = project.findProperty('RESYNC_RELEASE_STORE_FILE') ?: System.getenv('RESYNC_RELEASE_STORE_FILE')
def releaseStorePassword = project.findProperty('RESYNC_RELEASE_STORE_PASSWORD') ?: System.getenv('RESYNC_RELEASE_STORE_PASSWORD')
def releaseKeyAlias = project.findProperty('RESYNC_RELEASE_KEY_ALIAS') ?: System.getenv('RESYNC_RELEASE_KEY_ALIAS')
def releaseKeyPassword = project.findProperty('RESYNC_RELEASE_KEY_PASSWORD') ?: System.getenv('RESYNC_RELEASE_KEY_PASSWORD')

def hasReleaseSigningConfig = releaseStoreFile && file(releaseStoreFile.toString()).exists() &&
        releaseStorePassword && releaseKeyAlias && releaseKeyPassword

// versionCode must increase monotonically across releases: the number of commits on the branch
// is a simple, deterministic proxy for that (never decreases, doesn't need manual bookkeeping).
// versionName pairs that same count with a manually-bumped major.minor "product" version, since
// the repo doesn't currently use release tags to derive a semantic version from.
def gitCommitCount = {
    try {
        def process = ['git', 'rev-list', '--count', 'HEAD'].execute(null, projectDir)
        process.waitFor()
        return process.exitValue() == 0 ? process.text.trim().toInteger() : 1
    } catch (Exception ignored) {
        return 1
    }
}()

android {
    namespace = 'eu.monniot.resync'

    signingConfigs {
        if (hasReleaseSigningConfig) {
            release {
                storeFile file(releaseStoreFile.toString())
                storePassword releaseStorePassword.toString()
                keyAlias releaseKeyAlias.toString()
                keyPassword releaseKeyPassword.toString()
            }
        }
    }

    defaultConfig {
        // minSdkVersion <= targetSdkVersion <= compileSdk
        minSdkVersion 30
        targetSdkVersion 35
        compileSdk = 37

        applicationId "eu.monniot.resync"
        versionCode gitCommitCount
        versionName "1.0.${gitCommitCount}"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    buildTypes {
        release {
            minifyEnabled true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            signingConfig = hasReleaseSigningConfig ? signingConfigs.release : signingConfigs.debug
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    buildFeatures {
        compose = true
        buildConfig = true
    }

    testOptions {
        unitTests {
            includeAndroidResources = true
            // Robolectric's default graphicsMode (LEGACY) stubs out the rendering pipeline;
            // Compose UI tests (createComposeRule) need real-enough measure/layout/draw to work,
            // which requires NATIVE.
            all {
                it.systemProperty 'robolectric.graphicsMode', 'NATIVE'
            }
        }
    }
}

repositories {
    maven {
        url = 'https://github.com/psiegman/mvn-repo/raw/master/releases'
    }
}

dependencies {
    // Force usage of the maven central version, won't be required once compose:ui-tooling uses it
    implementation libs.kotlinx.collections.immutable

    ksp libs.room.compiler
    implementation libs.room.runtime
    implementation libs.room.ktx

    implementation libs.androidx.core.ktx
    implementation libs.androidx.appcompat
    implementation libs.material


    def composeBom = platform(libs.compose.bom)
    implementation composeBom
    testImplementation composeBom
    androidTestImplementation composeBom

    implementation libs.compose.ui
    implementation libs.compose.material3
    implementation libs.compose.material.icons.core
    implementation libs.compose.material.icons.extended
    implementation libs.compose.ui.tooling.preview
    debugImplementation libs.compose.ui.tooling
    implementation libs.androidx.lifecycle.viewmodel.compose
    implementation libs.androidx.activity.compose

    // Compose UI testing (Robolectric-hosted, see testOptions.unitTests.all below for the
    // graphicsMode this needs). ui-test-manifest registers a test-only ComponentActivity via
    // manifest merging; Robolectric unit tests pick it up from the merged debug-variant manifest
    // (processDebugUnitTestManifest merges AAR manifests from the tested/debug variant, not from
    // the test runtime classpath), so debugImplementation alone is required and sufficient - a
    // testImplementation copy of the same dependency is a no-op.
    testImplementation libs.compose.ui.test.junit4
    debugImplementation libs.compose.ui.test.manifest


    implementation libs.jsoup

    implementation(libs.epublib.core) {
        exclude group: 'org.slf4j'
        exclude group: 'xmlpull'
    }
    implementation libs.slf4j.android

    testImplementation libs.junit
    testImplementation libs.kotlinx.coroutines.test
    testImplementation libs.robolectric

    androidTestImplementation libs.androidx.test.ext.junit
    androidTestImplementation libs.androidx.test.espresso.core
}

jacoco {
    toolVersion = "0.8.12"
}

// Robolectric loads application classes through its own InstrumentingClassLoader, so the
// JaCoco agent sees them without a code-source location and, by default, drops their
// execution data - which is why every Robolectric-based test previously contributed 0%.
// includeNoLocationClasses tells the agent to keep that data so it can be mapped back to
// the on-disk class files used for structural analysis below. Required, not optional:
// without it Driver.kt reports 27.4% instead of 87.1%, and the coverage regression gate in
// .github/workflows/ci.yml is measured against the inflated-by-this-fix baseline.
// jdk.internal.* is excluded below because otherwise the agent trips over JDK-internal
// lambda classes that Robolectric's classloader also ends up touching.
tasks.withType(Test).configureEach {
    jacoco {
        includeNoLocationClasses = true
        excludes = ['jdk.internal.*']
    }
}

// JVM unit test coverage only (testDebugUnitTest) — the Room DB tests that require a real
// Android environment live in connectedAndroidTest and aren't covered here.
tasks.register('jacocoTestReport', JacocoReport) {
    dependsOn 'testDebugUnitTest'
    group = 'verification'
    description = 'Generates an HTML/XML JaCoco coverage report from the debug unit tests.'

    reports {
        xml.required = true
        html.required = true
    }

    // Drop generated code (R/BuildConfig, Room's *_Impl DAOs/database, Compose's synthetic
    // ComposableSingletons/LiveLiterals classes) so it doesn't dilute the coverage numbers.
    def coverageExcludes = [
            '**/R.class',
            '**/R$*.class',
            '**/BuildConfig.*',
            '**/Manifest*.*',
            'android/**/*.*',
            '**/*_Impl.class',
            '**/*_Impl$*.class',
            '**/*ComposableSingletons*.*',
            '**/*LiveLiterals*.*',
    ]

    def javaClasses = fileTree(layout.buildDirectory.dir('intermediates/javac/debug/compileDebugJavaWithJavac/classes')) {
        exclude coverageExcludes
    }
    // AGP's built-in Kotlin support (in use since the project dropped the kotlin.android
    // plugin) compiles here instead of the old tmp/kotlin-classes/debug.
    def kotlinClasses = fileTree(layout.buildDirectory.dir('intermediates/built_in_kotlinc/debug/compileDebugKotlin/classes')) {
        exclude coverageExcludes
    }

    classDirectories.setFrom(files(javaClasses, kotlinClasses))
    sourceDirectories.setFrom(files("$projectDir/src/main/java"))
    executionData.setFrom(layout.buildDirectory.file('jacoco/testDebugUnitTest.exec'))
}
