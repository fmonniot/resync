plugins {
    alias(libs.plugins.android.application)
    alias(libs.plugins.kotlin.android)
    alias(libs.plugins.ksp)
    alias(libs.plugins.kotlin.compose)
}

// Release signing is machine-specific: the keystore and its credentials live outside version
// control, in ~/.gradle/gradle.properties (or the matching environment variables, for CI). When
// they're not present — any machine but the owner's — the release build type falls back to the
// debug signing config so `assembleRelease` still produces an installable (debug-signed) APK
// instead of failing outright.
def releaseStoreFile = project.findProperty('RESYNC_RELEASE_STORE_FILE') ?: System.getenv('RESYNC_RELEASE_STORE_FILE')
def releaseStorePassword = project.findProperty('RESYNC_RELEASE_STORE_PASSWORD') ?: System.getenv('RESYNC_RELEASE_STORE_PASSWORD')
def releaseKeyAlias = project.findProperty('RESYNC_RELEASE_KEY_ALIAS') ?: System.getenv('RESYNC_RELEASE_KEY_ALIAS')
def releaseKeyPassword = project.findProperty('RESYNC_RELEASE_KEY_PASSWORD') ?: System.getenv('RESYNC_RELEASE_KEY_PASSWORD')

def hasReleaseSigningConfig = releaseStoreFile && file(releaseStoreFile.toString()).exists() &&
        releaseStorePassword && releaseKeyAlias && releaseKeyPassword

// versionCode must increase monotonically across releases: the number of commits on the branch
// is a simple, deterministic proxy for that (never decreases, doesn't need manual bookkeeping).
// versionName pairs that same count with a manually-bumped major.minor "product" version, since
// the repo doesn't currently use release tags to derive a semantic version from.
def gitCommitCount = {
    try {
        def process = ['git', 'rev-list', '--count', 'HEAD'].execute(null, projectDir)
        process.waitFor()
        return process.exitValue() == 0 ? process.text.trim().toInteger() : 1
    } catch (Exception ignored) {
        return 1
    }
}()

android {
    namespace 'eu.monniot.resync'

    signingConfigs {
        if (hasReleaseSigningConfig) {
            release {
                storeFile file(releaseStoreFile.toString())
                storePassword releaseStorePassword.toString()
                keyAlias releaseKeyAlias.toString()
                keyPassword releaseKeyPassword.toString()
            }
        }
    }

    defaultConfig {
        // minSdkVersion <= targetSdkVersion <= compileSdk
        minSdkVersion 30
        targetSdkVersion 35
        compileSdk = 37

        applicationId "eu.monniot.resync"
        versionCode gitCommitCount
        versionName "1.0.${gitCommitCount}"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    buildTypes {
        release {
            minifyEnabled true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            signingConfig hasReleaseSigningConfig ? signingConfigs.release : signingConfigs.debug
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = '17'
        freeCompilerArgs += "-opt-in=kotlin.RequiresOptIn"
    }
    buildFeatures {
        compose true
        buildConfig true
    }

    testOptions {
        unitTests {
            includeAndroidResources = true
        }
    }
}

repositories {
    maven {
        url 'https://github.com/psiegman/mvn-repo/raw/master/releases'
    }
}

dependencies {
    // Force usage of the maven central version, won't be required once compose:ui-tooling uses it
    implementation libs.kotlinx.collections.immutable

    ksp libs.room.compiler
    implementation libs.room.runtime
    implementation libs.room.ktx

    implementation libs.androidx.core.ktx
    implementation libs.androidx.appcompat
    implementation libs.material
    implementation libs.accompanist.swiperefresh


    def composeBom = platform(libs.compose.bom)
    implementation composeBom
    testImplementation composeBom
    androidTestImplementation composeBom

    implementation libs.compose.ui
    implementation libs.compose.material
    implementation libs.compose.material3
    implementation libs.compose.material.icons.core
    implementation libs.compose.ui.tooling.preview
    debugImplementation libs.compose.ui.tooling
    implementation libs.androidx.lifecycle.viewmodel.compose
    implementation libs.androidx.activity.compose


    implementation libs.jsoup

    implementation(libs.epublib.core) {
        exclude group: 'org.slf4j'
        exclude group: 'xmlpull'
    }
    implementation libs.slf4j.android

    testImplementation libs.junit
    testImplementation libs.kotlinx.coroutines.test
    testImplementation libs.robolectric

    androidTestImplementation libs.androidx.test.ext.junit
    androidTestImplementation libs.androidx.test.espresso.core
}
