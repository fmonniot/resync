buildscript {

    repositories {
        google()
        mavenCentral()
    }

    dependencies {

        classpath 'com.android.tools.build:gradle:9.4.0-rc01'
        classpath 'org.jetbrains.kotlin:kotlin-gradle-plugin:2.4.10'
    }
}

plugins {
    id 'com.google.devtools.ksp' version '2.3.11' apply false
}

allprojects {
    repositories {
        google()
        mavenCentral()
    }
}
